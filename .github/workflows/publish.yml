name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: bun@latest
          install: false
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Stage for publishing
        env:
          NPM_TAG: ${{ github.event.release.prerelease == true && 'next' || 'latest' }}
        run: pnpm stage publish --no-git-checks --tag $NPM_TAG
